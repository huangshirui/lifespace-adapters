name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository baseline
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            AGENTS.md
            SECURITY.md
            CONTRIBUTING.md
            LICENSE
            docs/architecture.md
            docs/lifespace-contract-consumption.md
            docs/mcp-adapter.md
            docs/github-hardening.md
            adapters/mcp/README.md
            adapters/mcp/src/progressive-discovery.mjs
            adapters/mcp/src/projection.mjs
            adapters/mcp/test/projection.test.mjs
            adapters/mcp/test/projection-fail-closed.test.mjs
            shared/README.md
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty required file: $file" >&2
              exit 1
            fi
          done

          forbidden_paths=(
            apps/api/README.md
            apps/web/README.md
            docs/requirements-v0.1.md
            docs/domain-model-v0.1.md
            docs/versioning-and-layout-v0.1.md
            docs/mcp-tool-surface-v0.1.md
            packages/adapters/README.md
            packages/domain/README.md
            packages/mcp/README.md
            schemas/v0.1/README.md
          )

          for path in "${forbidden_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Atlas template residue must be removed: $path" >&2
              exit 1
            fi
          done

          grep -q "LifeSpace Adapters" README.md
          grep -q "LifeSpace Adapters Agent Instructions" AGENTS.md
          grep -q "AGPL-3.0-or-later" README.md
          grep -q "AGPL-3.0-or-later" AGENTS.md

          if grep -R -n --exclude=LICENSE --exclude=ci.yml --exclude-dir=.git "AISR Atlas" .; then
            echo "Atlas template residue found in current tree" >&2
            exit 1
          fi

  mcp-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check MCP projection core
        run: |
          node --check adapters/mcp/src/progressive-discovery.mjs
          node --check adapters/mcp/src/projection.mjs
          node --check adapters/mcp/src/domain-projection.mjs
          node --check adapters/mcp/src/mcp-http.mjs
          node --check adapters/mcp/src/general-discovery.mjs
      - name: Install official MCP Server SDK v2
        working-directory: adapters/mcp
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test MCP projection core and HTTP adapter
        run: node --test adapters/mcp/test/*.test.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Public-repository safety must inspect history, not only the current tree.
          fetch-depth: 0
      - name: Scan full Git history for secrets
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git --redact --no-banner /repo

  notion-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Notion provider adapter
        run: |
          node --check adapters/notion/src/provider.mjs
          node --check adapters/notion/src/connection-vault.mjs
          node --check adapters/notion/src/worker.mjs
      - name: Test Notion provider contract and safety boundaries
        run: node --test adapters/notion/test/*.test.mjs
