name: temp-notion-file-upload

on:
  push:
    branches: [feat/notion-file-upload]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/notion-file-upload
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Notion file upload implementation
        run: python scripts/apply-notion-file-upload.py
      - name: Align Notion file upload tests
        run: python scripts/fix-notion-upload-test.py
      - name: Syntax check
        run: |
          node --check adapters/notion/src/provider.mjs
          node --check adapters/notion/src/connection-vault.mjs
          node --check adapters/notion/src/worker.mjs
      - name: Test Notion provider contract and safety boundaries
        run: node --test adapters/notion/test/*.test.mjs
      - name: Commit verified adapter changes
        run: |
          rm -f scripts/apply-notion-file-upload.py scripts/fix-notion-upload-test.py .github/workflows/temp-notion-file-upload.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(notion): add external file upload capability"
          git push origin HEAD:feat/notion-file-upload
