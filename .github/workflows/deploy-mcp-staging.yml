name: Deploy private LifeSpace MCP adapter staging

# Owner-triggered only. Deploys the Adapter Worker alone: NEVER Core, Identity,
# Account, D1 or production. Target Worker must remain private to Service Bindings.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lifespace-mcp-adapter-staging
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require human owner and reviewed main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = huangshirui
          test "$GITHUB_TRIGGERING_ACTOR" = huangshirui
          test "$GITHUB_REF_NAME" = main
      - name: Require successful exact-SHA main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=100)"
          echo "$RUNS" | jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
              and .event == "push" and .status == "completed"
              and .conclusion == "success")] | length > 0'
          echo "Exact-SHA main CI succeeded."
  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail before mutation without existing Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo "Protected Staging credentials are present; no value displayed."
      - name: Verify MCP protocol and deny-path tests
        run: |
          set -euo pipefail
          node --check adapters/mcp/src/identity-oauth-worker.mjs
          node --test adapters/mcp/test/*.test.mjs
      - name: Validate private staging configuration without mutation
        run: >-
          npx --yes --package wrangler@4.135.0 wrangler deploy
          --dry-run --config adapters/mcp/wrangler.staging.jsonc
          --outdir .wrangler/staging-review
      - name: Deploy Adapter-only Staging Worker (no public routes)
        run: >-
          npx --yes --package wrangler@4.135.0 wrangler deploy
          --config adapters/mcp/wrangler.staging.jsonc
      - name: Summarize prepared private endpoint
        shell: bash
        run: |
          {
            echo "## Private LifeSpace MCP Adapter / staging"
            echo ""
            echo "- Worker: \`lifespace-mcp-adapter-staging\`"
            echo "- Public URL: none (workers.dev and preview URLs disabled; no routes)"
            echo "- Same-environment Service Bindings: Core Staging, Identity Staging"
            echo "- Resource secret: NOT configured yet (fails closed); run owner-only LifeSpace paired-secret workflow next"
            echo "- Next: paired-secret workflow, then owner-reviewed Core Staging MCP_ADAPTER binding and OAuth E2E"
            echo "- Production: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
